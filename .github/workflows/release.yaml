# SPDX-License-Identifier: Apache-2.0

name: Release OSCAL Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'governance/**'
      - 'cmd/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o ./bin/demo ./cmd/demo

      - name: Run conversions
        run: ./bin/demo

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep 'version:' governance/controls/controls.yaml | head -1 | awk '{print $2}')
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read summary
        if: steps.check.outputs.exists == 'false'
        id: summary
        run: |
          {
            echo 'body<<SUMMARY_EOF'
            cat output/summary.md
            echo 'SUMMARY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.summary.outputs.body }}
          files: |
            output/oscal-catalog.json
            output/oscal-assessment-results.json
            output/controls.md
